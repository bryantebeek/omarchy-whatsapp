[graph]
all-features = true
targets = ["x86_64-unknown-linux-gnu"]

[advisories]
unmaintained = "workspace"

[licenses]
confidence-threshold = 0.93
allow = [
  "Apache-2.0",
  "BSD-3-Clause",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MPL-2.0",
  "Unicode-3.0",
  "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# The only permitted git source is upstream whatsapp-rust, pinned in Cargo.toml
# to a pull-request commit the daemon depends on. Read the comment above that
# dependency before pointing this anywhere else.
allow-git = ["https://github.com/oxidezap/whatsapp-rust"]
