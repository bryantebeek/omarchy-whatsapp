[workspace]
members = ["crates/protocol", "crates/daemon", "crates/ctl"]
resolver = "3"

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.94"
license = "MIT"
repository = "https://github.com/bryantebeek/omarchy-whatsapp"

[workspace.dependencies]
anyhow = "1.0"
async-trait = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4.5", features = ["derive"] }
dirs = "6.0"
futures = "0.3"
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs"] }
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
rusqlite = { version = "0.40", features = ["chrono"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
tempfile = "3.20"
tokio = { version = "1.47", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7", features = ["codec"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
ureq = "3.4"
# whatsapp-rust is pinned to a commit that is not on upstream main yet: the head
# of https://github.com/oxidezap/whatsapp-rust/pull/1397 ("feat(presence): let
# the host own the automatic available announcement"). The daemon cannot run
# without it: run_daemon passes PresencePolicy::Manual so reconnects and
# push-name updates never advertise the linked device as available on their own
# (see "Event and asset policy" in ARCHITECTURE.md; an available companion also
# stops the phone from being notified). The commit is reachable through the pull
# request ref, which is why it resolves from the upstream repository without any
# fork.
#
# WAIT FOR THE UPSTREAM MERGE. Once PR 1397 is merged, move this pin to the
# merged upstream commit (or the next tagged release that includes it) and drop
# this paragraph. Do not "fix" the pin by pointing it at a fork again. Any
# change to this line (rev, branch, or repository) requires checking, in this
# order, before it can be merged:
#   1. The presence policy is present in the new revision (BotBuilder::
#      with_presence_policy and PresencePolicy::Manual), or upstream replaced
#      it with an equivalent and run_daemon/ARCHITECTURE.md are updated to it.
#   2. crates/daemon/src/transport.rs (ClientTransport) still compiles: it is
#      the single adapter for every SDK call, so upstream API changes surface
#      there rather than throughout the daemon.
#   3. The daemon reads and writes the library's PRIVATE session.db schema to
#      force app-state resyncs: tables app_state_versions and
#      app_state_mutation_macs (column name), the device.push_name column, and
#      the collection names critical_block, critical_unblock_low, regular,
#      regular_low, regular_high, used by crates/daemon/src/sync.rs
#      (prepare_contact_name_resync, prepare_event_state_resync) and
#      crates/daemon/src/database.rs (regular_app_state_is_complete). A rename
#      upstream only degrades to a warning at runtime, so verify those tables
#      and names against the new revision's sqlite storage backend.
#   4. deny.toml allow-git must name the same repository, and
#      ./scripts/generate-license-report.sh --check must still pass (the
#      report is generated from the crate metadata of the pinned revision).
whatsapp-rust = { version = "0.7", git = "https://github.com/oxidezap/whatsapp-rust", rev = "9fa1602214652eb364bb68cfb22f6b03fef7caf6", default-features = false, features = ["sqlite-storage", "tokio-transport", "tokio-runtime", "ureq-client", "tokio-native", "signal"] }
buffa = "0.9.1"

[workspace.lints.rust]
unsafe_code = "forbid"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage_nightly)'] }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
struct_excessive_bools = "allow"
too_many_lines = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
