[workspace]
members = ["crates/protocol", "crates/daemon", "crates/ctl"]
resolver = "3"

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.94"
license = "MIT"
repository = "https://github.com/bryantebeek/omarchy-whatsapp"

[workspace.dependencies]
aes = "0.9"
anyhow = "1.0"
async-trait = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4.5", features = ["derive"] }
dirs = "6.0"
cbc = { version = "0.2", features = ["alloc"] }
futures = "0.3"
hkdf = "0.13"
hmac = "0.13"
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs"] }
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
rand = "0.10"
rusqlite = { version = "0.39", features = ["chrono"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
tempfile = "3.20"
thiserror = "2.0"
tokio = { version = "1.47", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7", features = ["codec"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
ureq = "3.4"
whatsapp-rust = { version = "0.7", git = "https://github.com/bryantebeek/whatsapp-rust", rev = "ababb2f41e5abd5a9d90003e943f1b5b0606b882", default-features = false, features = ["sqlite-storage", "tokio-transport", "tokio-runtime", "ureq-client", "tokio-native", "signal"] }
buffa = "0.9.1"

[workspace.lints.rust]
unsafe_code = "forbid"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage_nightly)'] }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
struct_excessive_bools = "allow"
too_many_lines = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
